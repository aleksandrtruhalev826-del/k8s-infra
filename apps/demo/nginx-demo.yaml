apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-demo-nginx
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: argocd-demo-nginx
  template:
    metadata:
      labels:
        app: argocd-demo-nginx
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: argocd-demo-nginx
  namespace: default
spec:
  selector:
    app: argocd-demo-nginx
  ports:
  - port: 80
    targetPort: 80
